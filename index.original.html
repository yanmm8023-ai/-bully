<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chinese Buddy｜汉语陪伴伙伴</title>
<style>
:root{--ink:#203047;--muted:#68788b;--line:#e6ebf2;--bg:#f5f7fb;--blue:#315ee8;--pale:#edf2ff;--green:#e7f7ef}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:24px 16px 36px}
header{display:flex;align-items:center;gap:14px;padding:12px 2px 22px}
.logo{width:52px;height:52px;border-radius:17px;background:linear-gradient(135deg,#315ee8,#8d9fff);display:grid;place-items:center;color:#fff;font-size:26px;box-shadow:0 8px 20px #315ee833}
h1{font-size:23px;margin:0 0 4px} .sub{font-size:13px;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 35px #2030470a;overflow:hidden}
.top{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.badge{font-size:12px;color:#26764a;background:var(--green);padding:7px 10px;border-radius:99px}
.settings{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,button,textarea{font:inherit}
select{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 11px;color:var(--ink)}
.chat{height:min(52vh,500px);min-height:310px;overflow-y:auto;padding:22px 18px;background:linear-gradient(#fff,#fbfcff)}
.msg{display:flex;gap:10px;margin:0 0 18px;align-items:flex-start}
.avatar{flex:0 0 34px;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:var(--pale);font-size:18px}
.msg.user{flex-direction:row-reverse}
.msg.user .avatar{background:#eaf7ef}
.bubble{max-width:min(78%,620px);padding:12px 14px;border-radius:4px 16px 16px 16px;background:#f0f3f9;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user .bubble{background:#e9efff;border-radius:16px 4px 16px 16px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.quick{display:flex;gap:8px;flex-wrap:wrap;padding:14px 18px 4px}
.chip{border:1px solid #dfe6f7;background:#fff;color:#3454b4;border-radius:99px;padding:8px 12px;font-size:13px;cursor:pointer}
.chip:hover{background:var(--pale)}
.composer{padding:14px 18px 18px;display:flex;gap:10px;align-items:flex-end}
textarea{flex:1;resize:vertical;min-height:48px;max-height:140px;border:1px solid var(--line);border-radius:15px;padding:13px 14px;outline:none}
textarea:focus{border-color:#8da5ff;box-shadow:0 0 0 3px #315ee814}
.send{border:0;background:var(--blue);color:#fff;border-radius:14px;padding:13px 18px;font-weight:600;cursor:pointer}
.send:hover{background:#244bd0}
.note{padding:0 20px 18px;color:var(--muted);font-size:12px;line-height:1.6}
.voice-tools{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 14px}
.voice-btn{border:1px solid #dfe6f7;background:#fff;color:#3454b4;border-radius:10px;padding:8px 11px;font-size:13px;cursor:pointer}
.voice-btn:hover{background:var(--pale)}
.speak-btn{display:inline-block;margin-top:7px;border:1px solid #dfe6f7;background:#fff;color:#3454b4;border-radius:9px;padding:5px 9px;font-size:12px;cursor:pointer}
.speak-btn:hover{background:var(--pale)}
@media(max-width:560px){.wrap{padding:15px 10px 24px}h1{font-size:20px}.chat{padding:17px 12px}.bubble{max-width:84%}.composer{padding:12px}.top{padding:14px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo">中</div>
  <div><h1>Chinese Buddy 汉语陪伴伙伴</h1><div class="sub">像朋友一样聊天 · 在交流中练习中文</div></div>
</header>
<main class="card">
  <div class="top">
    <span class="badge">● 练习模式 · 无需登录</span>
    <div class="settings">
      <select id="level" aria-label="中文水平"><option value="初级">初级中文</option><option value="中级">中级中文</option><option value="高级">高级中文</option></select>
      <select id="help" aria-label="辅助语言"><option value="中文">中文辅助</option><option value="英语">English help</option><option value="巴西葡萄牙语">Ajuda em português</option></select>
      <select id="scene" aria-label="聊天主题"><option value="自由聊天">自由聊天</option><option value="日常生活">日常生活</option><option value="餐厅点餐">餐厅点餐</option><option value="购物">购物</option><option value="旅行">旅行</option><option value="交朋友">交朋友</option></select>
    </div>
  </div>
  <section class="chat" id="chat" aria-live="polite">
    <div class="msg"><div class="avatar">🤖</div><div><div class="bubble">你好！我是你的汉语伙伴 Chinese Buddy 😊\n我们可以像朋友一样聊天。我会尽量使用适合你水平的中文，也可以帮你修改不太自然的表达。\n\n你今天过得怎么样？</div><div class="hint">提示：这是一个演示网页。点击“朗读”可听中文发音；也可尝试语音输入。回复由预设规则生成，不会调用在线 AI。</div></div></div>
  </section>
  <div class="quick">
    <button class="chip" data-text="我今天很开心，因为……">聊聊今天</button>
    <button class="chip" data-text="我们来练习在餐厅点餐吧。">餐厅点餐</button>
    <button class="chip" data-text="请帮我纠正这句话：我昨天去商店然后我吃饭。">练习纠错</button>
    <button class="chip" data-text="我不知道说什么，你问我一个简单的问题吧。">给我一个问题</button>
  </div>
  <div class="voice-tools">
    <button class="voice-btn" type="button" id="voiceToggle">🔊 开启/关闭自动朗读</button>
    <button class="voice-btn" type="button" id="micBtn">🎙️ 语音输入</button>
    <select id="voiceRate" aria-label="朗读速度"><option value="0.8">慢速朗读</option><option value="1" selected>正常速度</option><option value="1.15">稍快朗读</option></select>
  </div>
  <form class="composer" id="form">
    <textarea id="input" placeholder="用中文写一句话……（Enter 发送，Shift + Enter 换行）"></textarea>
    <button class="send" type="submit">发送 ↑</button>
  </form>
  <div class="note">教学用途演示版：网页会在浏览器中运行，不会保存或上传你输入的内容。回答由预设对话规则生成，不等同于真正的 AI 自由对话。</div>
</main>
</div>
<script>
const chat=document.getElementById('chat'), input=document.getElementById('input');
const level=document.getElementById('level'), help=document.getElementById('help'), scene=document.getElementById('scene');
const voiceRate=document.getElementById('voiceRate');
let autoSpeak=false;

function speakChinese(text){
 if(!('speechSynthesis' in window)){
   alert('当前浏览器暂不支持朗读功能，请尝试使用最新版 Chrome。'); return;
 }
 window.speechSynthesis.cancel();
 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang='zh-CN';
 utterance.rate=Number(voiceRate.value || 1);
 const voices=window.speechSynthesis.getVoices();
 const zhVoice=voices.find(v=>/^zh-CN/i.test(v.lang)) || voices.find(v=>/^zh/i.test(v.lang));
 if(zhVoice) utterance.voice=zhVoice;
 window.speechSynthesis.speak(utterance);
}
function add(text,who='bot',hint=''){
 const row=document.createElement('div');row.className='msg'+(who==='user'?' user':'');
 const av=document.createElement('div');av.className='avatar';av.textContent=who==='user'?'🙂':'🤖';
 const col=document.createElement('div');
 const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;col.appendChild(bubble);
 if(who==='bot'){
   const speakBtn=document.createElement('button');speakBtn.type='button';speakBtn.className='speak-btn';speakBtn.textContent='🔊 朗读中文';
   speakBtn.addEventListener('click',()=>speakChinese(text));
   col.appendChild(speakBtn);
 }
 if(hint){const h=document.createElement('div');h.className='hint';h.textContent=hint;col.appendChild(h)}
 row.append(av,col);chat.appendChild(row);chat.scrollTop=chat.scrollHeight;
 if(who==='bot' && autoSpeak) speakChinese(text);
}
function answer(raw){
 const t=raw.trim(), s=scene.value, l=level.value;
 if(/我不知道|不知道说什么|问我/.test(t)) return '没关系，我们慢慢来！😊\n你平时喜欢做什么？比如听音乐、看电影、运动，或者旅行？';
 if(/纠正|改正|语法|怎么说|自然的表达/.test(t)||/我昨天.*然后我/.test(t)) return '我们可以一起看看这句话。比如“我昨天去商店然后我吃饭”可以说：\n“我昨天去商店买东西，然后去吃饭了。”\n\n讲过去发生的事情时，注意让动词和时间顺序更清楚。你想再试着说一句吗？';
 if(/累|辛苦|疲惫/.test(t)) return '辛苦了！听起来你今天不太轻松。你今天做了什么？是工作累，还是学习累？';
 if(/开心|高兴|快乐/.test(t)) return '真好！听到你今天很开心，我也替你高兴 😊 是什么事情让你这么开心呢？';
 if(/难过|伤心|不开心/.test(t)) return '抱抱你。愿意和我说说发生什么了吗？你可以慢慢说，我会认真听。';
 if(/喜欢|爱好|兴趣/.test(t)) return '很有意思！你为什么喜欢这个呢？你通常多久做一次？';
 if(/吃|美食|饭|餐厅|点餐/.test(t)||s==='餐厅点餐') return s==='餐厅点餐'?'欢迎光临！你好，请问你想吃点什么？你可以说：“我想要一碗牛肉面。”':'听起来不错！你最喜欢吃什么？你会做这道菜吗？';
 if(/买|购物|商店|多少钱/.test(t)||s==='购物') return '我们来练习购物吧！店员问：“你好，请问你想买什么？”你可以告诉我你想买的东西和颜色。';
 if(/旅行|旅游|中国|城市/.test(t)||s==='旅行') return '我很喜欢聊旅行！你最想去中国的哪个城市？为什么想去那里？';
 if(/你好|嗨|您好|hello|hi/i.test(t)) return '你好呀！很高兴和你聊天 😊 你今天过得怎么样？';
 if(/谢谢/.test(t)) return '不客气！😊 和我聊天就是练习中文。你还想聊些什么？';
 if(/再见|拜拜/.test(t)) return '再见！今天辛苦啦。记得每天用一点中文表达自己，我们下次再聊！';
 if(/工作|上班|学习|上课|学校/.test(t)) return '原来如此！你可以多跟我说一点吗？这件事让你觉得开心、紧张，还是有点累？';
 if(/朋友|家人|妈妈|爸爸/.test(t)) return '听起来这是你生活中很重要的一部分。你们平时喜欢一起做什么？';
 if(l==='初级') return '我明白了！😊 你可以再说一点吗？\n比如：什么时候发生的？和谁一起？你觉得怎么样？';
 if(l==='中级') return '谢谢你和我分享！如果你愿意，可以再描述一下当时的情况，以及你为什么会这么想。';
 return '这是一个值得继续聊的话题。你能不能从另一个角度解释一下你的想法？我很想听听你的理由。';
}
document.getElementById('form').addEventListener('submit',e=>{
 e.preventDefault();const t=input.value.trim();if(!t)return;add(t,'user');input.value='';
 setTimeout(()=>add(answer(t),'bot'),350);
});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('form').requestSubmit()}});
document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{input.value=b.dataset.text;input.focus()}));
document.getElementById('voiceToggle').addEventListener('click',()=>{
 autoSpeak=!autoSpeak;
 document.getElementById('voiceToggle').textContent=autoSpeak?'🔊 自动朗读：已开启':'🔊 开启/关闭自动朗读';
 if(autoSpeak) speakChinese('自动朗读已开启');
});
document.getElementById('micBtn').addEventListener('click',()=>{
 const Recognition=window.SpeechRecognition || window.webkitSpeechRecognition;
 if(!Recognition){alert('当前浏览器不支持语音输入。请使用最新版 Chrome，或直接打字输入。');return;}
 const recognition=new Recognition();
 recognition.lang='zh-CN'; recognition.interimResults=false; recognition.maxAlternatives=1;
 document.getElementById('micBtn').textContent='🎙️ 正在听…';
 recognition.onresult=e=>{input.value=e.results[0][0].transcript;input.focus();};
 recognition.onerror=()=>alert('没有识别到语音，请检查麦克风权限后再试。');
 recognition.onend=()=>{document.getElementById('micBtn').textContent='🎙️ 语音输入';};
 recognition.start();
});
</script>
</body>
</html>
